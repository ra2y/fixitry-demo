# A deterministic demo-only rule. It detects the fake key in app/config.py
# without requiring a realistic credential format.
rules:
  - id: securefix-demo-hardcoded-key
    category: demo
    title: Hardcoded demo payment API key
    severity: HIGH
    path: .*\.py
    keywords:
      - demo_payment_api_key
    regex: '(?i)(?P<key>demo_payment_api_key)\s*=\s*"(?P<secret>[^"]{12,})"'
    secret-group-name: secret

